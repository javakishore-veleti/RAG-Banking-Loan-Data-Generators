# F016 — Real-artifact seeding.
#
# Every term, rate range and checklist item below was taken from a public
# source listed in data/seeds/SEEDS.md. The `source` on each entry is the
# seed ID from that manifest. Do not add invented terms: if a source
# cannot be fetched, do not use its terms.
#
# Loaded by src/generator/generator.py at runtime. It tries PyYAML first
# and falls back to a minimal built-in parser for this file's shape
# (nested mappings, lists of scalars, lists of `text`/`source` mappings).
# The generator works without this file — it falls back to its built-in
# terms, rates and purposes.
