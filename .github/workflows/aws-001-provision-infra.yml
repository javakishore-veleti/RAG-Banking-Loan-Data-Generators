name: AWS-001 Provision Infra (manual)

# Manual only. Run this once (and again when infra changes) from
# Actions -> AWS-001 Provision Infra -> Run workflow.
# It deploys the CloudFormation stacks in order.
#
# AWS credentials come ONLY from GitHub Actions secrets — Kishore
# configures them later in Settings -> Secrets and variables ->
# Actions: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION,
# AWS_ACCOUNT_ID. Nothing is hard-coded in the repo. If a secret is
# missing the run fails at the first step with a message naming it.
#
# VPC — pick one when you run it (vpc_mode):
#   create-new (default): deploys infra/cloudformation/vpc.yaml
#     first ($PROJECT-vpc stack: VPC + 2 private subnets + NAT
#     gateway + security group) and uses its outputs. You configure
#     nothing — no VPC, subnet or security group secrets needed.
#     NOTE: the NAT gateway costs ~$32/month + data while the stack
#     exists; AWS-010 Destroy Infra deletes it.
#   use-existing: VPC/subnets/SG come from the
#     VPC_ID / SUBNET_IDS / SECURITY_GROUP_IDS secrets, or from the
#     vpc_id / subnet_ids / security_group_ids run inputs below
#     (inputs win over secrets). Only pick this if you already have
#     a VPC you want to reuse. Missing values fail the run with a
#     message saying which secret or input to set.
#
# ORDER MATTERS: the storage stack must deploy BEFORE the Planner
# Lambda is packaged, because packaging uploads planner.zip into the
# corpus bucket. The old order packaged first with an `aws s3 mb`
# fallback that created the bucket outside any stack — the storage
# changeset then failed on AWS::EarlyValidation::ResourceExistenceCheck
# (run #3, 2026-11-12), and the zip never uploaded either. A guarded
# cleanup step before the storage deploy removes that orphan bucket
# only when it is empty and the storage stack never completed.
# Same kind of ordering bug, fixed the same day: the worker image
# used to be built and pushed BEFORE the compute stack deployed, but
# the ECR repo is created by the compute stack — so the push would
# fail with "repository does not exist". Build/push now runs AFTER
# the compute deploy. The JobDefinition only references the image
# URI, so deploying compute first is fine.
on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project prefix (must match stack names)"
        required: true
        default: "rag-corpus"
      max_vcpus:
        description: "Max vCPUs for Batch Fargate Spot"
        required: false
        default: "64"
      vpc_mode:
        description: "VPC source: create-new (default, deploy vpc.yaml — nothing to configure) or use-existing (secrets/inputs)"
        required: true
        type: choice
        default: "create-new"
        options:
          - use-existing
          - create-new
      vpc_id:
        description: "Optional: existing VPC id (overrides VPC_ID secret; leave blank to use the secret)"
        required: false
        default: ""
      subnet_ids:
        description: "Optional: comma-separated subnet ids (overrides SUBNET_IDS secret; leave blank to use the secret)"
        required: false
        default: ""
      security_group_ids:
        description: "Optional: comma-separated security group ids (overrides SECURITY_GROUP_IDS secret; leave blank to use the secret)"
        required: false
        default: ""

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  PROJECT: ${{ inputs.project }}

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Check AWS secrets are configured
        run: |
          MISSING=""
          [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && MISSING="$MISSING AWS_ACCESS_KEY_ID"
          [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ] && MISSING="$MISSING AWS_SECRET_ACCESS_KEY"
          [ -z "${{ secrets.AWS_REGION }}" ] && MISSING="$MISSING AWS_REGION"
          [ -z "${{ secrets.AWS_ACCOUNT_ID }}" ] && MISSING="$MISSING AWS_ACCOUNT_ID"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing GitHub secrets:$MISSING — set them in repo Settings -> Secrets and variables -> Actions, then re-run AWS-001."
            exit 1
          fi
          echo "AWS secrets present (values not shown). VPC mode: ${{ inputs.vpc_mode }}"

      - name: Resolve VPC (use-existing) or create a new one
        run: |
          if [ "${{ inputs.vpc_mode }}" = "create-new" ]; then
            echo "Creating new VPC stack $PROJECT-vpc ..."
            aws cloudformation deploy \
              --template-file Middleware/Workflows/Datagen/infra/cloudformation/vpc.yaml \
              --stack-name $PROJECT-vpc \
              --parameter-overrides Project=$PROJECT
            VPC_ID=$(aws cloudformation describe-stacks --stack-name $PROJECT-vpc --query 'Stacks[0].Outputs[?OutputKey==`VpcId`].OutputValue' --output text)
            SUBNET_IDS=$(aws cloudformation describe-stacks --stack-name $PROJECT-vpc --query 'Stacks[0].Outputs[?OutputKey==`SubnetIds`].OutputValue' --output text)
            SECURITY_GROUP_IDS=$(aws cloudformation describe-stacks --stack-name $PROJECT-vpc --query 'Stacks[0].Outputs[?OutputKey==`SecurityGroupId`].OutputValue' --output text)
          else
            # Run inputs win over secrets; blank input means "use the secret".
            VPC_ID="${{ inputs.vpc_id || secrets.VPC_ID }}"
            SUBNET_IDS="${{ inputs.subnet_ids || secrets.SUBNET_IDS }}"
            SECURITY_GROUP_IDS="${{ inputs.security_group_ids || secrets.SECURITY_GROUP_IDS }}"
          fi
          if [ -z "$VPC_ID" ] || [ -z "$SUBNET_IDS" ] || [ -z "$SECURITY_GROUP_IDS" ]; then
            echo "::error::VPC not resolved (mode=${{ inputs.vpc_mode }}). Set the VPC_ID / SUBNET_IDS / SECURITY_GROUP_IDS secrets, pass vpc_id / subnet_ids / security_group_ids inputs, or re-run with vpc_mode=create-new."
            exit 1
          fi
          echo "VPC_ID=$VPC_ID" >> $GITHUB_ENV
          echo "SUBNET_IDS=$SUBNET_IDS" >> $GITHUB_ENV
          echo "SECURITY_GROUP_IDS=$SECURITY_GROUP_IDS" >> $GITHUB_ENV
          echo "VPC resolved: $VPC_ID (subnets/SG not shown)"

      - name: Remove orphan empty corpus bucket (if any)
        # Guarded self-heal for one specific past failure: AWS-001
        # used to package the Planner Lambda BEFORE the storage stack
        # deployed, and its `aws s3 mb` fallback created the corpus
        # bucket outside any stack. That orphan bucket then failed the
        # storage changeset (ResourceExistenceCheck). This step only
        # deletes the bucket when ALL of these hold: the storage stack
        # has never reached CREATE_COMPLETE, the bucket exists, and the
        # bucket is EMPTY (no objects, no versions). A bucket with data
        # is never touched — the step fails loudly instead.
        run: |
          BUCKET=$PROJECT-corpus-${{ secrets.AWS_ACCOUNT_ID }}
          STATUS=$(aws cloudformation describe-stacks --stack-name $PROJECT-storage --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo "NO-STACK")
          if [ "$STATUS" = "CREATE_COMPLETE" ]; then
            echo "Storage stack is CREATE_COMPLETE — bucket is stack-owned, nothing to clean."
            exit 0
          fi
          if ! aws s3api head-bucket --bucket "$BUCKET" >/dev/null 2>&1; then
            echo "Bucket $BUCKET does not exist — nothing to clean."
            exit 0
          fi
          COUNT=$(aws s3api list-object-versions --bucket "$BUCKET" --query 'length(Versions || `[]`) + length(DeleteMarkers || `[]`)' --output text 2>/dev/null || echo "UNKNOWN")
          if [ "$COUNT" = "0" ]; then
            echo "Orphan empty bucket $BUCKET found (storage stack status: $STATUS) — deleting it so the storage stack can create it."
            aws s3api delete-bucket --bucket "$BUCKET"
          else
            echo "::error::Bucket $BUCKET already exists with $COUNT object(s)/version(s) and the storage stack is $STATUS. Empty it first (AWS-009 Delete Data), then re-run AWS-001."
            exit 1
          fi

      - name: Deploy storage stack
        run: |
          aws cloudformation deploy \
            --template-file Middleware/Workflows/Datagen/infra/cloudformation/storage.yaml \
            --stack-name $PROJECT-storage \
            --parameter-overrides Project=$PROJECT \
            --capabilities CAPABILITY_NAMED_IAM

      - name: Package Planner Lambda
        # Runs AFTER the storage stack: the zip is uploaded into the
        # corpus bucket the stack just created. No `aws s3 mb` fallback
        # — creating the bucket here is what broke the storage deploy
        # (see the cleanup step above). If the upload fails, the run
        # fails loudly instead of silently continuing without the zip.
        run: |
          cd Middleware/Workflows/Datagen/src/planner && zip -r ../../../../../planner.zip . && cd ../../../../..
          aws s3 cp planner.zip s3://$PROJECT-corpus-${{ secrets.AWS_ACCOUNT_ID }}/lambda/planner.zip

      - name: Deploy compute stack (VPC resolved above)
        run: |
          aws cloudformation deploy \
            --template-file Middleware/Workflows/Datagen/infra/cloudformation/compute.yaml \
            --stack-name $PROJECT-compute \
            --parameter-overrides Project=$PROJECT \
              VpcId=$VPC_ID \
              SubnetIds=$SUBNET_IDS \
              SecurityGroupIds=$SECURITY_GROUP_IDS \
              MaxVcpus=${{ inputs.max_vcpus }} \
            --capabilities CAPABILITY_NAMED_IAM

      - name: Build and push worker image
        # Runs AFTER the compute stack: the ECR repo is created by
        # compute.yaml, so pushing before it deploys fails with
        # "repository does not exist".
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com
          docker build -t $PROJECT-worker:$GITHUB_SHA -f Middleware/Workflows/Datagen/Dockerfile Middleware/Workflows/Datagen
          docker tag $PROJECT-worker:$GITHUB_SHA ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com/$PROJECT-worker:latest
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com/$PROJECT-worker:latest

      - name: Deploy orchestration stack
        run: |
          aws cloudformation deploy \
            --template-file Middleware/Workflows/Datagen/infra/cloudformation/orchestration.yaml \
            --stack-name $PROJECT-orchestration \
            --parameter-overrides Project=$PROJECT \
              LambdaCodeBucket=$PROJECT-corpus-${{ secrets.AWS_ACCOUNT_ID }} \
              LambdaCodeKey=lambda/planner.zip
