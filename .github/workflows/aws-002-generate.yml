name: AWS-002 Generate (reusable)

# Shared bottom layer for all six document types. The per-format
# workflows (aws-003-generate-pdf.yml, aws-004-generate-docx.yml, …) are thin wrappers
# that call this one with a single format. No per-format code is
# duplicated here — the generator, worker, Batch job and Step Functions
# are all shared.
on:
  workflow_call:
    inputs:
      format:
        required: true
        type: string
      # NOTE: these inputs are `type: string`, not `type: number`.
      # wrappers pass workflow_dispatch inputs, which GitHub always
      # delivers as strings — a `type: number` here rejects them
      # with "Unexpected value '100'" before any job starts.
      # (AWS-003 run #1, 2026-11-12). The values are only ever
      # interpolated into shell/JSON text, so strings are fine.
      count:
        required: false
        type: string
        default: "1000"
      year:
        required: false
        type: string
        default: "2024"
      shard_size:
        required: false
        type: string
        default: "10000"
      seed:
        required: false
        type: string
        default: "7"
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION:
        required: true
      AWS_ACCOUNT_ID:
        required: true
      PROJECT:
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Start Step Functions run for ${{ inputs.format }} / ${{ inputs.year }}
        run: |
          RUN_ID="${{ inputs.year }}-${{ inputs.format }}-$(date +%Y%m%d-%H%M%S)"
          aws stepfunctions start-execution \
            --state-machine-arn arn:aws:states:${{ secrets.AWS_REGION }}:${{ secrets.AWS_ACCOUNT_ID }}:stateMachine:${{ secrets.PROJECT }}-run \
            --name "$RUN_ID" \
            --input "{\"total_per_format\": ${{ inputs.count }}, \"shard_size\": ${{ inputs.shard_size }}, \"formats\": [\"${{ inputs.format }}\"], \"year\": ${{ inputs.year }}, \"seed\": ${{ inputs.seed }}, \"run_id\": \"$RUN_ID\"}"
          echo "Started run $RUN_ID for format=${{ inputs.format }} year=${{ inputs.year }} count=${{ inputs.count }}"
