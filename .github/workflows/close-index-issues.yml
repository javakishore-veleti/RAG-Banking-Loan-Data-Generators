name: Close Index Issues (manual)

# One manual run closes the 21 indexing issues whose work is already
# done and verified in the repo (E010 core + metadata, F038 embedding
# config, S116–S117 tests + dry-run, F046 docs + release). The list
# lives in scripts/close_index_issues.py, with the evidence for each
# issue. Issue numbers are resolved by title prefix at run time.
# It is idempotent: re-running it skips already-closed issues.
# Closing via the repo's own GITHUB_TOKEN avoids one approval
# per issue. Do NOT add other issue IDs to the script without
# Kishore approving them — closing is the status change itself.
# Run this only AFTER the Create Index Issues run has created the
# issues, and AFTER the push shows CI green (F046/S119/S120 depend
# on it).
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  close-index-issues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Close verified-done indexing issues (21)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/close_index_issues.py
