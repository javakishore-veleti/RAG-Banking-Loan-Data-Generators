name: AWS-009 Delete Data (manual — DANGER)

# Manual only, end of life. Run this BEFORE aws-010-destroy-infra.yml.
# CloudFormation cannot delete a non-empty S3 bucket, so this workflow
# empties the corpus bucket and deletes the DynamoDB tables and queues
# first. CloudTrail is left until last, so the deletion itself is audited.
on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project prefix"
        required: true
        default: "rag-corpus"
      confirm:
        description: "Type DELETE-DATA to confirm"
        required: true
        default: ""

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  PROJECT: ${{ inputs.project }}

jobs:
  delete-data:
    if: inputs.confirm == 'DELETE-DATA'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Empty corpus S3 bucket (all versions + delete markers)
        run: |
          BUCKET=$PROJECT-corpus-${{ secrets.AWS_ACCOUNT_ID }}
          aws s3 rm s3://$BUCKET --recursive
          echo "Emptied s3://$BUCKET — run aws-010-destroy-infra.yml next to delete the bucket itself."
      - name: Delete DynamoDB tables
        run: |
          aws dynamodb delete-table --table-name $PROJECT-manifest || true
          aws dynamodb delete-table --table-name $PROJECT-dedup || true
      - name: Delete SQS queues
        run: |
          aws sqs delete-queue --queue-url https://sqs.$AWS_REGION.amazonaws.com/${{ secrets.AWS_ACCOUNT_ID }}/$PROJECT-shards.fifo || true
          aws sqs delete-queue --queue-url https://sqs.$AWS_REGION.amazonaws.com/${{ secrets.AWS_ACCOUNT_ID }}/$PROJECT-shards-dlq.fifo || true
