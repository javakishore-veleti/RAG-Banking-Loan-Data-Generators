name: Create Index Issues (manual)

# One manual run creates all milestones + issues from
# GITHUB_ISSUES_INDEXING.md (2 milestones, 5 epics, 13 features,
# 35 stories = 55 issues, M006/M007, E010–E014, F034–F046,
# S086–S120) plus the new indexing labels (bedrock, pgvector,
# opensearch, embeddings, data-indexing, index-wf, rds, chunking,
# metadata, hybrid-search).
# This exists because creating 55 issues via the Muse GitHub
# connector needs a fresh approval per issue. This workflow uses the
# repo's own GITHUB_TOKEN, so one manual run does the whole set.
# It is idempotent: re-running it skips issues that already exist
# and PATCHes their labels + milestone.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  create-index-issues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Create milestones, labels, epics, features, stories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PLAN_FILE: GITHUB_ISSUES_INDEXING.md
          EXPECTED_MILESTONES: "2"
          EXPECTED_EPICS: "5"
          EXPECTED_FEATURES: "13"
          EXPECTED_STORIES: "35"
          PLAN_SCOPE: "Data indexing only. No retrieval, reranking, agents, or UI."
        run: python3 scripts/create_issues.py
