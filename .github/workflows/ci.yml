name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests/ -q
      - run: python -m py_compile src/generator/generator.py src/planner/planner.py src/worker/batch_worker.py
      - run: python3 uniqueness_check.py --count 50 --seed 7 || true
