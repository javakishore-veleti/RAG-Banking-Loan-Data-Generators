name: Inspect CloudFormation Stack (reusable + manual)

# Read-only: prints a CloudFormation stack's status and its recent
# stack events (the detail CloudFormation points to when a deploy
# fails, e.g. "use the DescribeEvents API for detailed failure
# information"). It never creates, updates or deletes anything.
#
# Two ways to use it:
#   1. Manually: Actions -> Inspect CloudFormation Stack -> Run workflow,
#      pick the stack name from the dropdown.
#   2. Reusable: another workflow calls it with `uses:
#      ./.github/workflows/inspect-cloudformation-stack.yml` and passes
#      `stack_name` plus the three AWS secrets below.
#
# AWS credentials come ONLY from GitHub Actions secrets — the same
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_REGION secrets the
# other AWS workflows use. Nothing is hard-coded, and no AWS console
# sign-in is needed.
on:
  workflow_call:
    inputs:
      stack_name:
        description: "CloudFormation stack to inspect"
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION:
        required: true
  workflow_dispatch:
    inputs:
      stack_name:
        description: "CloudFormation stack to inspect (pick from the dropdown)"
        required: true
        type: choice
        default: "rag-corpus-vpc"
        options:
          - rag-corpus-vpc
          - rag-corpus-storage
          - rag-corpus-compute
          - rag-corpus-orchestration
          - rag-corpus-indexing
          - rag-corpus-index-orchestration

permissions:
  contents: read

jobs:
  inspect-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Stack status and recent events
        run: |
          STACK="${{ inputs.stack_name }}"
          echo "== Stack status: $STACK =="
          aws cloudformation describe-stacks --stack-name "$STACK" --query 'Stacks[0].{StackName:StackName,StackStatus:StackStatus,Created:CreationTime}' --output table || echo "describe-stacks: stack $STACK not found or not readable."
          echo "== Recent stack events (newest first): $STACK =="
          aws cloudformation describe-stack-events --stack-name "$STACK" --max-items 30 --query 'StackEvents[].{Time:Timestamp,LogicalId:LogicalResourceId,Status:ResourceStatus,Reason:ResourceStatusReason}' --output table || echo "describe-stack-events: no events available for stack $STACK."
