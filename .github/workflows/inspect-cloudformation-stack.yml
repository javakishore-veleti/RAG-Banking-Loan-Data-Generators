name: Inspect CloudFormation Stack (reusable + manual)

# Read-only: prints a CloudFormation stack's status and its recent
# stack events (the detail CloudFormation points to when a deploy
# fails, e.g. "use the DescribeEvents API for detailed failure
# information"). It never creates, updates or deletes anything.
#
# Two ways to use it:
#   1. Manually: Actions -> Inspect CloudFormation Stack -> Run workflow,
#      pick the stack name from the dropdown.
#   2. Batch logs: pass log_stream (a CloudWatch log stream name, e.g.
#      rag-corpus-indexer/default/<task-id>) to dump that container's
#      log events — the step that names the real error when a Step
#      Functions execution fails at SubmitBatchWorkers.
#   3. Reusable: another workflow calls it with `uses:
#      ./.github/workflows/inspect-cloudformation-stack.yml` and passes
#      `stack_name` plus the three AWS secrets below.
#
# AWS credentials come ONLY from GitHub Actions secrets — the same
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_REGION secrets the
# other AWS workflows use. Nothing is hard-coded, and no AWS console
# sign-in is needed.
on:
  workflow_call:
    inputs:
      stack_name:
        description: "CloudFormation stack to inspect"
        required: true
        type: string
      log_stream:
        description: "CloudWatch log stream to dump, e.g. rag-corpus-indexer/default/<task-id>; blank = skip"
        required: false
        default: ""
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION:
        required: true
  workflow_dispatch:
    inputs:
      stack_name:
        description: "CloudFormation stack to inspect (pick from the dropdown)"
        required: true
        type: choice
        default: "rag-corpus-vpc"
        options:
          - rag-corpus-vpc
          - rag-corpus-storage
          - rag-corpus-compute
          - rag-corpus-orchestration
          - rag-corpus-indexing
          - rag-corpus-index-orchestration
      log_stream:
        description: "CloudWatch log stream to dump, e.g. rag-corpus-indexer/default/<task-id>; blank = skip"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  inspect-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Stack status and recent events
        run: |
          STACK="${{ inputs.stack_name }}"
          echo "== Stack status: $STACK =="
          aws cloudformation describe-stacks --stack-name "$STACK" --query 'Stacks[0].{StackName:StackName,StackStatus:StackStatus,Created:CreationTime}' --output table || echo "describe-stacks: stack $STACK not found or not readable."
          echo "== Recent stack events (newest first): $STACK =="
          aws cloudformation describe-stack-events --stack-name "$STACK" --max-items 30 --query 'StackEvents[].{Time:Timestamp,LogicalId:LogicalResourceId,Status:ResourceStatus,Reason:ResourceStatusReason}' --output table || echo "describe-stack-events: no events available for stack $STACK."

      - name: Failed changeset detail
        run: |
          STACK="${{ inputs.stack_name }}"
          echo "== Change sets for $STACK =="
          for CS in $(aws cloudformation list-change-sets --stack-name "$STACK" --query 'Summaries[].ChangeSetName' --output text 2>/dev/null); do
            echo "--- Change set: $CS ---"
            aws cloudformation describe-change-set --stack-name "$STACK" --change-set-name "$CS" --query '{Status:Status,StatusReason:StatusReason}' --output table || echo "describe-change-set failed for $CS."
          done
          echo "(no change sets listed above means none exist for this stack)"

      - name: Do the storage template's named resources already exist?
        # Only meaningful for the *-storage stack. The early-validation
        # hook AWS::EarlyValidation::ResourceExistenceCheck fails the
        # changeset when a resource the template wants to create already
        # exists outside the stack — this step tests exactly that, for
        # every named resource in storage.yaml. Read-only.
        run: |
          STACK="${{ inputs.stack_name }}"
          case "$STACK" in
            *-storage) PROJECT="${STACK%-storage}" ;;
            *) echo "Resource-existence check is only defined for a *-storage stack; skipping for $STACK."; exit 0 ;;
          esac
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "Project: $PROJECT, Account: $ACCOUNT"
          check() { # check <label> <command...>
            local label="$1"; shift
            if "$@" >/dev/null 2>&1; then echo "EXISTS: $label"; else echo "missing: $label"; fi
          }
          check "S3 bucket $PROJECT-corpus-$ACCOUNT" aws s3api head-bucket --bucket "$PROJECT-corpus-$ACCOUNT"
          check "S3 bucket $PROJECT-trail-$ACCOUNT" aws s3api head-bucket --bucket "$PROJECT-trail-$ACCOUNT"
          check "DynamoDB table $PROJECT-manifest" aws dynamodb describe-table --table-name "$PROJECT-manifest"
          check "DynamoDB table $PROJECT-dedup" aws dynamodb describe-table --table-name "$PROJECT-dedup"
          check "SQS queue $PROJECT-shards.fifo" aws sqs get-queue-url --queue-name "$PROJECT-shards.fifo"
          check "SQS queue $PROJECT-shards-dlq.fifo" aws sqs get-queue-url --queue-name "$PROJECT-shards-dlq.fifo"
          if aws cloudtrail describe-trails --query "trailList[?Name=='$PROJECT-trail']" --output text | grep -q "$PROJECT-trail"; then echo "EXISTS: CloudTrail $PROJECT-trail"; else echo "missing: CloudTrail $PROJECT-trail"; fi

      - name: Fetch Batch CloudWatch logs (if a log stream was given)
        # Dumps the CloudWatch log events for one Batch job log stream —
        # the step that names the real error when a Step Functions
        # execution fails at SubmitBatchWorkers (the execution history
        # only says the container exited). Batch's default log group
        # is /aws/batch/job. Read-only.
        if: ${{ inputs.log_stream != '' }}
        run: |
          STREAM="${{ inputs.log_stream }}"
          GROUP="/aws/batch/job"
          echo "== CloudWatch log stream: $GROUP / $STREAM =="
          aws logs describe-log-streams --log-group-name "$GROUP" --log-stream-name-prefix "$STREAM" --query 'logStreams[].{Stream:logStreamName,LastEvent:lastEventTimestamp}' --output table || echo "describe-log-streams: log group $GROUP not found or not readable."
          echo "== Log events (oldest first, up to 200) =="
          aws logs get-log-events --log-group-name "$GROUP" --log-stream-name "$STREAM" --limit 200 --start-from-head --query 'events[].message' --output text || echo "get-log-events failed for $STREAM - check the log group/stream names."
